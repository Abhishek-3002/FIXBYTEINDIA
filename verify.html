<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Partner Card Verification | FIXBYTE INDIA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f7f8fc,#efecff);font-family:Inter,system-ui,sans-serif;color:#1a1931;padding:18px}.card{width:min(470px,100%);background:#fff;border:1px solid #e6e4ef;border-radius:22px;padding:28px;box-shadow:0 24px 70px #24155b16;text-align:center}.logo{font-weight:950;letter-spacing:1px}.logo span{color:#6847df}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(140deg,#6847df,#a18af7);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;margin:0 auto 13px}.spin{width:34px;height:34px;border:3px solid #e7e2ff;border-top-color:#6847df;border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}.result{display:none;margin-top:22px;padding:18px;border-radius:15px;background:#f8f7fc;text-align:left;line-height:1.7;font-size:13px}.result.show{display:block}.badge{display:inline-block;border-radius:99px;padding:6px 10px;font-size:10px;font-weight:900}.ok{background:#e4f7ed;color:#11764f}.bad{background:#fff0f0;color:#b33c49}.muted{color:#73798d;font-size:12px}.btn{display:inline-block;margin-top:20px;padding:12px 17px;border-radius:11px;background:#6847df;color:white;text-decoration:none;font-size:12px;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="mark">F</div><div class="logo">FIXBYTE <span>INDIA</span></div><h2>Partner Card Verification</h2><p class="muted">CMADD Connected Medical Partner Program</p><div id="loading"><div class="spin"></div><p class="muted">Checking secure card record…</p></div><div id="result" class="result"></div><a class="btn" href="/">Official FIXBYTE Website</a></main><script>function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}(async()=>{const token=decodeURIComponent(location.hash.slice(1)),load=document.getElementById("loading"),out=document.getElementById("result");try{if(token.length<30)throw new Error("This QR link is incomplete or invalid.");const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Card could not be verified.");load.style.display="none";out.className="result show";out.innerHTML='<span class="badge '+(d.verified?"ok":"bad")+'">'+(d.verified?"✓ VERIFIED PARTNER":"STATUS NOT ACTIVE")+'</span><h3 style="margin:14px 0 4px">'+esc(d.store_name)+'</h3><div class="muted">Card ID: '+esc(d.card_code)+'</div><p>Card status: <b>'+esc(d.card_status.toUpperCase())+'</b></p><p>CMADD connection: <b>'+esc(d.connection_status.toUpperCase())+'</b></p><p>Available ₹99 website offers: <b>'+Number(d.available_offers||0)+'</b></p><small class="muted">Checked '+new Date(d.checked_at).toLocaleString("en-IN")+'</small>';}catch(e){load.style.display="none";out.className="result show";out.innerHTML='<span class="badge bad">NOT VERIFIED</span><p>'+esc(e.message)+'</p>';}})();</script></body></html>
